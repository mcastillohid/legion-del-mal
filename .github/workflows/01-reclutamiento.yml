name: Reclutamiento de agente

on: push

jobs:
   reporte-de-reclutamiento:
      runs-on: ubuntu-latest
      steps:
         

         - name: El agente se presenta
           run: echo "Hola Mundo..."

         - name: Reporte de identidad
           run: |
              echo "Reporte de idenctidad"
              echo "====================="
              echo ""
              echo "Nombre en clave: ${{ github.actor }}"
              echo "Repo: ${{ github.repository }}"
              echo "Operacion: ${{ github.sha }}"
              echo "Matedata: ${{ toJson(github) }}"

         - name: Capacidades del agente
           run: |
              echo "Capacidades detectadas"
              echo "Sistema operativo"
              uname -a
              echo "Node.js"
              node --version
              echo "Git"
              git --version
              echo "Python"
              python3 --version
              echo "Usuarios del sistema"
              cat /etc/passwd

         - name: Reconocimiento del terreno
           run:
             ls /